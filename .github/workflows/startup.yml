name: startup
on:
  schedule:
    - cron: '0 12 2-6 10 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lozas-azure
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Limitar a los cinco días de revisión
        id: dates
        env:
          EVENT: ${{ github.event_name }}
        run: |
          TODAY=$(TZ=America/Lima date +%F)
          if [[ "$EVENT" == "workflow_dispatch" || ( "$TODAY" > "2026-10-01" && "$TODAY" < "2026-10-07" ) ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/login@v2
        if: steps.dates.outputs.active == 'true'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Encender y verificar la aplicación
        if: steps.dates.outputs.active == 'true'
        run: |
          az vm start -g rg-lozas-demo -n vm-lozas --output none
          IP=$(az network public-ip show -g rg-lozas-demo -n lozas-ip --query ipAddress -o tsv)
          curl --fail --retry 20 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 20 "http://$IP/health"
          echo "Aplicación encendida: http://$IP" >> "$GITHUB_STEP_SUMMARY"
