name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lozas-azure
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Ejecutar en la máquina de Azure
        env:
          REPO: ${{ github.repository }}
          REV: ${{ github.sha }}
        run: |
          export DOMAIN=$(az network public-ip show -g rg-lozas-demo -n lozas-ip --query dnsSettings.fqdn -o tsv)
          test -n "$DOMAIN"
          python - <<'SCRIPT'
          import os,shlex,tarfile,io,base64
          from pathlib import Path
          args=' '.join(shlex.quote(x) for x in ['deploy',os.environ['REPO'],os.environ['REV'],os.environ['DOMAIN']])
          buffer=io.BytesIO()
          with tarfile.open(fileobj=buffer,mode='w:gz') as tar:
              for path in ['.dockerignore','app.py','requirements.txt','Dockerfile','Caddyfile','compose.https.yml','compose.yml','bd.sql','feed.sql','templates','tests','scripts']:
                  tar.add(path)
          payload=base64.b64encode(buffer.getvalue()).decode()
          unpack="mkdir -p /opt/lozas\nprintf '%s' '"+payload+"' | base64 -d | tar xz -C /opt/lozas\n"
          Path('/tmp/remote.sh').write_text('set -eu\n'+unpack+"cat > /tmp/lozas-action.sh <<'LOZAS_REMOTE'\n"+Path('scripts/remote.sh').read_text()+'\nLOZAS_REMOTE\nbash /tmp/lozas-action.sh '+args+'\n')
          SCRIPT
          az vm run-command invoke -g rg-lozas-demo -n vm-lozas --command-id RunShellScript --scripts @/tmp/remote.sh -o json > /tmp/result.json
          python - <<'SCRIPT'
          import json
          data=json.load(open('/tmp/result.json'))
          values=data.get('value',[])
          for v in values: print(v.get('message',''))
          if not any('LOZAS_SUCCESS' in v.get('message','') for v in values): raise SystemExit(1)
          SCRIPT
      - name: Verificar URL pública
        run: |
          DOMAIN=$(az network public-ip show -g rg-lozas-demo -n lozas-ip --query dnsSettings.fqdn -o tsv)
          curl --fail --retry 30 --retry-delay 10 --connect-timeout 10 --max-time 20 --retry-all-errors "https://$DOMAIN/health"
          echo "Aplicación: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
